<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Myomap — embeddable muscle preview</title>
<script type="importmap">
{
  "imports": {
    "three": "./three.module.js",
    "three/addons/": "./"
  }
}
</script>
<style>
  :root {
    --mm-bg: #f3f2f2;
    --mm-ink: #201e1d;
    --mm-accent: #ec3013;
    --mm-muted: #6f6a66;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--mm-bg); color: var(--mm-ink);
    font-family: Archivo, system-ui, sans-serif;
    overflow: hidden;
  }
  #wrap { position: relative; width: 100%; height: 100%; }
  #wrap canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .controls {
    position: absolute; right: 10px; bottom: 10px; z-index: 3;
    display: flex; gap: 2px;
  }
  .controls button {
    appearance: none; cursor: pointer;
    font-family: inherit; font-weight: 600; font-size: 10px;
    letter-spacing: 0.12em; text-transform: uppercase;
    padding: 7px 10px; border: 2px solid var(--mm-ink); border-radius: 0;
    background: color-mix(in srgb, var(--mm-bg) 86%, transparent);
    color: var(--mm-ink); backdrop-filter: blur(4px);
  }
  .controls button:hover { background: color-mix(in srgb, var(--mm-accent) 12%, var(--mm-bg)); }
  .controls button[aria-pressed="true"] { background: var(--mm-ink); border-color: var(--mm-ink); color: var(--mm-bg); }
  .controls button:focus-visible { outline: 2px solid var(--mm-accent); outline-offset: 2px; }

  .caption {
    position: absolute; left: 10px; top: 10px; right: 84px; z-index: 3;
    display: flex; flex-wrap: wrap; gap: 3px; pointer-events: none;
  }
  .caption b {
    font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 3px 6px; background: var(--mm-accent); color: #fff;
  }
  .caption i {
    font-style: normal; font-size: 9px; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; padding: 3px 6px;
    border: 1px solid var(--mm-accent); color: var(--mm-accent);
  }
  .caption[hidden] { display: none; }

  .loader {
    position: absolute; inset: 0; z-index: 4;
    display: grid; place-content: center; gap: 8px; justify-items: center;
    background: var(--mm-bg);
    font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mm-muted);
  }
  .loader .bar { width: 120px; height: 3px; background: #d6d2cf; }
  .loader .bar i { display: block; height: 100%; width: 8%; background: var(--mm-accent); transition: width .25s; }
</style>
</head>
<body>
  <div id="wrap">
    <div class="caption" id="caption" hidden></div>
    <div class="controls">
      <button type="button" id="spin" aria-pressed="true" title="Turntable">Spin</button>
      <button type="button" id="xray" aria-pressed="false" title="See through unworked muscle">X-ray</button>
    </div>
    <div class="loader" id="loader">
      <span id="loaderText">Loading · 0%</span>
      <div class="bar"><i id="loaderBar"></i></div>
    </div>
  </div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { loadFigure, GROUPS, PRESETS } from './anatomy.js';

const wrap = document.getElementById('wrap');
const params = new URLSearchParams(location.search);
const flag = (k, dflt) => (params.has(k) ? !/^(0|false|no)$/i.test(params.get(k)) : dflt);
const list = (k) => (params.get(k) || '').split(',').map((s) => s.trim()).filter(Boolean);

// ── Renderer / scene ────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(params.get('bg') || '#f3f2f2');

const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 60);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 0.9;
controls.maxDistance = 6;
controls.enabled = flag('interactive', true);

scene.add(new THREE.HemisphereLight(0xffffff, 0x8d8781, 1.15));
const key = new THREE.DirectionalLight(0xffffff, 1.9);
key.position.set(2.4, 3.4, 3.0);
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.62);
fill.position.set(-2.8, 1.6, -2.2);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 0.5);
rim.position.set(0, 2.0, -3.6);
scene.add(rim);

// ── Model ───────────────────────────────────────────────────────────
const loader = document.getElementById('loader');
const loaderText = document.getElementById('loaderText');
const loaderBar = document.getElementById('loaderBar');

const { root, groups, breath, bodyMaterials } = await loadFigure(
  params.get('model') || 'Male_Muscular_System_V05.fbx',
  (msg) => {
    loaderText.textContent = msg.replace('Loading anatomy', 'Loading');
    const pct = /(\d+)%/.exec(msg);
    loaderBar.style.width = pct ? Math.max(8, +pct[1] * 0.85) + '%' : '92%';
  }
);

const turntable = new THREE.Group();
turntable.add(root);
scene.add(turntable);
loader.remove();

// Frame on the torso: in a small preview the T-pose arm span would otherwise
// shrink the body to nothing.
const box = new THREE.Box3().setFromObject(root);
const height = box.max.y - box.min.y;
const focusY = box.min.y + height * 0.5;
const maxTags = Math.max(2, parseInt(params.get('maxlabels') || '4', 10));
controls.target.set(0, focusY, 0);
function frame() {
  const w = wrap.clientWidth || 1, h = wrap.clientHeight || 1;
  const aspect = w / h;
  camera.aspect = aspect;
  const fitH = (height * 1.04) / (2 * Math.tan((camera.fov * Math.PI) / 360));
  const fitW = fitH / Math.max(aspect, 0.42);
  camera.position.set(0, focusY, Math.max(fitH, fitW));
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
frame();
new ResizeObserver(frame).observe(wrap);

// ── State ───────────────────────────────────────────────────────────
const caption = document.getElementById('caption');
const spinBtn = document.getElementById('spin');
const xrayBtn = document.getElementById('xray');
const showLabels = flag('labels', true);

let spinning = flag('spin', true);
let xray = flag('xray', false);
spinBtn.setAttribute('aria-pressed', String(spinning));
xrayBtn.setAttribute('aria-pressed', String(xray));
spinBtn.hidden = !flag('controls', true);
xrayBtn.hidden = !flag('controls', true);

function applyXray() {
  for (const m of bodyMaterials()) {
    m.transparent = xray; m.opacity = xray ? 0.12 : 1; m.depthWrite = !xray; m.needsUpdate = true;
  }
  for (const g of Object.values(groups)) {
    const ghost = xray && g.state === 0;
    for (const m of g.materials) {
      m.transparent = ghost; m.opacity = ghost ? 0.12 : 1; m.depthWrite = !ghost; m.needsUpdate = true;
    }
    for (const mesh of g.meshes) mesh.renderOrder = ghost ? -1 : 0;
  }
}
function renderCaption() {
  if (!showLabels) { caption.hidden = true; return; }
  const prim = GROUPS.filter((g) => groups[g.id].state === 1);
  const sec = GROUPS.filter((g) => groups[g.id].state === 2);
  const total = prim.length + sec.length;
  // A small preview can't carry twenty tags — name the first few, count the rest.
  const shownP = prim.slice(0, maxTags);
  const remainingSlots = Math.max(0, maxTags - shownP.length);
  const shownS = sec.slice(0, remainingSlots);
  const hidden = total - shownP.length - shownS.length;
  caption.innerHTML =
    shownP.map((g) => `<b>${g.label}</b>`).join('') +
    shownS.map((g) => `<i>${g.label}</i>`).join('') +
    (hidden > 0 ? `<i>+${hidden}</i>` : '');
  caption.hidden = total === 0;
}
function setEngagement(primary = [], secondary = []) {
  for (const g of GROUPS) {
    groups[g.id].state = primary.includes(g.id) ? 1 : secondary.includes(g.id) ? 2 : 0;
  }
  applyXray();
  renderCaption();
  emit();
}
function emit() {
  const detail = {
    primary: GROUPS.filter((g) => groups[g.id].state === 1).map((g) => g.id),
    secondary: GROUPS.filter((g) => groups[g.id].state === 2).map((g) => g.id),
    spin: spinning, xray,
  };
  window.dispatchEvent(new CustomEvent('myomap:change', { detail }));
  if (window.parent !== window) window.parent.postMessage({ type: 'myomap:change', ...detail }, '*');
}

spinBtn.addEventListener('click', () => { spinning = !spinning; spinBtn.setAttribute('aria-pressed', String(spinning)); emit(); });
xrayBtn.addEventListener('click', () => { xray = !xray; xrayBtn.setAttribute('aria-pressed', String(xray)); applyXray(); emit(); });

// ── Loop (pauses when scrolled out of view or the tab is hidden) ─────
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reduced) { spinning = false; spinBtn.setAttribute('aria-pressed', 'false'); }
let visible = true;
new IntersectionObserver(([e]) => { visible = e.isIntersecting; }).observe(wrap);
document.addEventListener('visibilitychange', () => { visible = !document.hidden; });

const speed = parseFloat(params.get('speed') || '0.4');
let last = performance.now();
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (!visible) return;
  if (spinning) turntable.rotation.y = (turntable.rotation.y + dt * speed) % (Math.PI * 2);
  const pulse = 0.5 + 0.5 * Math.sin(now * 0.0021);
  breath.value = Math.pow(0.5 + 0.5 * Math.sin(now * 0.0016), 1.4);
  for (const g of Object.values(groups)) {
    const target = g.state === 1 ? 1 : g.state === 2 ? 0.46 : 0;
    g.t += (target - g.t) * (1 - Math.exp(-dt * 9));
    g.uniforms.uHi.value = g.t;
    g.uniforms.uPulse.value = g.state === 1 ? pulse : 0;
    for (const m of g.materials) m.roughness = 0.78 - 0.26 * g.t;
  }
  controls.update();
  renderer.render(scene, camera);
}
requestAnimationFrame(tick);

// ── Public API ──────────────────────────────────────────────────────
const api = {
  groups: GROUPS.map((g) => ({ id: g.id, label: g.label, muscles: g.sub, region: g.region })),
  presets: PRESETS.map((p) => p.name),
  set: setEngagement,
  preset(name) {
    const p = PRESETS.find((x) => x.name.toLowerCase() === String(name).toLowerCase());
    if (p) setEngagement(p.primary, p.secondary);
  },
  clear() { setEngagement([], []); },
  spin(on) { spinning = !!on; spinBtn.setAttribute('aria-pressed', String(spinning)); emit(); },
  xray(on) { xray = !!on; xrayBtn.setAttribute('aria-pressed', String(xray)); applyXray(); emit(); },
  facing(deg) { turntable.rotation.y = (deg * Math.PI) / 180; },
};
window.MuscleMap = api;

// Drive it from a parent frame: postMessage({type:'myomap', primary:[…]})
window.addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.type !== 'myomap') return;
  if (d.preset) api.preset(d.preset);
  else if (d.primary || d.secondary) api.set(d.primary || [], d.secondary || []);
  if (d.spin !== undefined) api.spin(d.spin);
  if (d.xray !== undefined) api.xray(d.xray);
});

// Initial state from the query string.
if (params.get('preset')) api.preset(params.get('preset'));
else setEngagement(list('primary'), list('secondary'));
applyXray();
window.dispatchEvent(new Event('myomap:ready'));
if (window.parent !== window) window.parent.postMessage({ type: 'myomap:ready' }, '*');
</script>
</body>
</html>
