<script>
window.setHydrationLevel=function(raw){
  const progress=Math.max(0,Math.min(1,Number(raw)||0));
  const top=712-(progress*712);
  document.getElementById('water').setAttribute('transform','translate(0 '+top.toFixed(1)+')');
};
window.setHydrationState=function(raw,stops,fillHeight){
  window.setHydrationLevel(raw);
  if(!Array.isArray(stops)||stops.length===0)return;
  const gradient=document.getElementById('waterGradient');
  gradient.setAttribute('gradientUnits','userSpaceOnUse');
  gradient.setAttribute('x1','0');
  gradient.setAttribute('x2','0');
  gradient.setAttribute('y1','0');
  gradient.setAttribute('y2',String(Math.max(1,Number(fillHeight)||1)));
  gradient.replaceChildren();
  stops.forEach(item=>{
    const stop=document.createElementNS('http://www.w3.org/2000/svg','stop');
    stop.setAttribute('offset',String(Math.max(0,Math.min(1,Number(item.offset)||0))));
    stop.setAttribute('stop-color',String(item.color));
    gradient.appendChild(stop);
  });
};
window.setHydrationState(0,[]);
</script></body></html>
