name: APEXNative

options:
  bundleIdPrefix: ch.apexperformance
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.54.1

settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    DEVELOPMENT_TEAM: UG979XDY72
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 369
    MARKETING_VERSION: 1.0.0
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  APEX:
    type: application
    platform: iOS
    sources:
      - path: APEX
    resources:
      - path: APEX/Resources
      - path: APEX/PrivacyInfo.xcprivacy
    dependencies:
      - package: Supabase
        product: Supabase
      - target: APEXWatch
        embed: true
    entitlements:
      path: APEX/APEX.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.applesignin:
          - Default
    info:
      path: APEX/Info.plist
      properties:
        CFBundleDisplayName: APEX
        CFBundleName: APEX
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        NSCameraUsageDescription: APEX uses the camera to scan food barcodes and capture private visual-progress photos.
        NSPhotoLibraryUsageDescription: APEX can import a progress photo that you choose.
        NSPhotoLibraryAddUsageDescription: APEX can save route posters and progress exports that you request.
        NSHealthShareUsageDescription: APEX reads the health and activity data you choose so nutrition, recovery, Avatar, and Orbit stay aligned.
        NSHealthUpdateUsageDescription: APEX writes completed workouts and water entries only when you choose to sync them with Apple Health.
        NSLocationWhenInUseUsageDescription: APEX Orbit uses your location to record runs and plan routes while the app is open.
        NSLocationAlwaysAndWhenInUseUsageDescription: APEX Orbit continues recording an active run when your screen is locked.
        UIBackgroundModes:
          - location
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - ch.apexperformance.APEX.health-refresh
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: ch.apexperformance.APEX.auth
            CFBundleURLSchemes:
              - apex
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.apexperformance.APEX
        PRODUCT_NAME: APEX
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        GENERATE_INFOPLIST_FILE: NO

  APEXWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: APEXWatch
      - path: APEX/Core/Engine/HydrationLedger.swift
      - path: APEX/Core/Engine/WatchHydrationFillState.swift
      - path: APEX/Core/Engine/WatchHydrationPreferences.swift
      - path: APEX/Core/Engine/WatchHydrationReminderPolicy.swift
    dependencies:
      - target: APEXWatchWidgets
        embed: true
    entitlements:
      path: APEXWatch/APEXWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups:
          - group.ch.apexperformance.APEX
    info:
      path: APEXWatch/Info.plist
      properties:
        CFBundleDisplayName: APEX Water
        CFBundleName: APEX Water
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: ch.apexperformance.APEX
        WKBackgroundModes:
          - workout-processing
        WKRunsIndependentlyOfCompanionApp: true
        NSHealthShareUsageDescription: APEX reads today's water total so the Watch and iPhone remain aligned.
        NSHealthUpdateUsageDescription: APEX adds water to Apple Health when you tap a quantity on the Watch.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.apexperformance.APEX.watchkitapp
        PRODUCT_NAME: APEX Water
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        GENERATE_INFOPLIST_FILE: NO

  APEXWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: APEXWatchWidgets
      - path: APEX/Core/Engine/HydrationLedger.swift
      - path: APEX/Core/Engine/WatchHydrationFillState.swift
      - path: APEX/Core/Engine/WatchHydrationPreferences.swift
    entitlements:
      path: APEXWatchWidgets/APEXWatchWidgets.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups:
          - group.ch.apexperformance.APEX
    info:
      path: APEXWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: APEX Water
        CFBundleName: APEXWatchWidgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHealthShareUsageDescription: APEX reads today's water total so the complication stays current.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.apexperformance.APEX.watchkitapp.widgets
        PRODUCT_NAME: APEXWatchWidgets
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  APEXTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: APEXTests
    dependencies:
      - target: APEX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.apexperformance.APEXTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/APEX.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/APEX
        BUNDLE_LOADER: $(TEST_HOST)

  APEXUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: APEXUITests
    dependencies:
      - target: APEX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.apexperformance.APEXUITests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  APEX:
    build:
      targets:
        APEX: all
        APEXTests: [test]
        APEXUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: APEXTests
        - name: APEXUITests
    archive:
      config: Release
